hero:
  bio:
    - 'Welcome to my homepage. I am a senior researcher at <a href="https://www.vti.se/en/employees/abderrahman-ait-ali">VTI, the Swedish National Road and Transport Research Institute</a>, and an adjunct associate professor at <a href="https://liu.se/en/employee/abdai17">Linköping University</a>.'
    - "My academic work focuses on transport economics, optimization, and applied transport analysis for public transport and railway systems. Current research includes maintenance prioritization, passenger-centric punctuality, and information during railway disruptions."
  affiliations:
    - label: "VTI"
      url: "https://www.vti.se/en/employees/abderrahman-ait-ali"
      note: "Senior researcher, Swedish National Road and Transport Research Institute"
    - label: "Linköping University"
      url: "https://liu.se/en/employee/abdai17"
      note: "Adjunct associate professor, Department of Science and Technology"
profile:
  heading: "I work on decision support for public transport and railway systems."
  paragraphs:
    - "My research combines transport economics, optimization, and applied transport analysis, with current work on maintenance prioritization, passenger-centric punctuality, and information during railway disruptions."

research_interests:
  intro: "My research interests combine transport economics, optimization, and decision support for railway and public transport systems."
  items:
    - title: "Transport economics"
      summary: "Cost-benefit analysis, socio-economic appraisal, and valuation questions in public transport and railway systems."
    - title: "Capacity and timetabling"
      summary: "Railway capacity allocation, timetable design, and operational planning under infrastructure and demand constraints."
    - title: "Maintenance and life-cycle costing"
      summary: "Decision support for infrastructure maintenance, renewal strategies, and long-term asset management."
    - title: "Passenger information"
      summary: "Information provision during disruptions, passenger-centric punctuality, and service quality evaluation."

teaching_snapshot:
  - title: "Optimization and Statistics in Transportation"
    summary: "Introduction to linear, nonlinear, and integer optimization with transportation applications."
    url: "https://studieinfo.liu.se/en/kurs/TNK127/ht-2023"
  - title: "Public transportation and rail traffic"
    summary: "Public transport and rail systems with a focus on tactical planning."
    url: "https://studieinfo.liu.se/en/kurs/TNK125"
  - title: "Master thesis supervision"
    summary: "Supervision in passenger-centric punctuality, railway analytics, and public transport data analysis."

