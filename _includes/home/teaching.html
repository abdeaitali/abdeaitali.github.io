<section class="home-section" aria-labelledby="teaching-supervision">
  <div class="home-section-header">
    <div>
      <h2 id="teaching-supervision">Teaching and supervision</h2>
    </div>
    <p class="home-section-link"><a href="/teaching/">Teaching page</a></p>
  </div>

  <div class="home-list">
    {% for item in site.data.home.teaching_snapshot %}
    <article class="home-list-item">
      <h3>{{ item.title }}</h3>
      <p>{{ item.summary }}</p>
      {% if item.url %}
      <p class="home-inline-links"><a href="{{ item.url }}">Course information</a></p>
      {% endif %}
    </article>
    {% endfor %}
  </div>
</section>
