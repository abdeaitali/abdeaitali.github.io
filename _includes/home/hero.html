{% assign hero = site.data.home.hero %}
<aside class="home-sidebar" aria-label="Profile">
  <div class="home-sidebar-photo">
    <img src="/images/profile.jpeg" alt="Portrait of {{ site.title }}">
  </div>

  <div class="home-sidebar-copy">
    <div class="home-sidebar-bio">
      {% for paragraph in hero.bio %}
      <p>{{ paragraph }}</p>
      {% endfor %}
    </div>
  </div>
</aside>
