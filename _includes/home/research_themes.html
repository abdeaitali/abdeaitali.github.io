<section class="home-section home-intro-section" aria-labelledby="research-themes">
  <p class="home-kicker">Research</p>
  <h2 id="research-themes">Transport economics, optimization, and railway systems</h2>
  <p class="home-section-intro">{{ site.data.home.research_interests.intro }}</p>

  <div class="home-theme-grid">
    {% for interest in site.data.home.research_interests.items %}
    <article class="home-list-item">
      <h3>{{ interest.title }}</h3>
      <p>{{ interest.summary }}</p>
    </article>
    {% endfor %}
  </div>
</section>
