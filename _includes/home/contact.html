<section class="home-section home-contact-section" aria-labelledby="contact-overview">
  <div class="home-section-header">
    <div>
      <h2 id="contact-overview">Contact</h2>
    </div>
    <p class="home-section-link"><a href="/contact/">Contact page</a></p>
  </div>

  <div class="home-list">
    <article class="home-list-item">
      <ul class="home-link-list">
        {% for item in site.data.home.contact.emails %}
        {% unless item.label == "Personal" %}
        <li><a href="mailto:{{ item.address }}">{{ item.label }}</a></li>
        {% endunless %}
        {% endfor %}
      </ul>
    </article>
  </div>
</section>
